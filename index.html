<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Veemo</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff;
}

#header{
    padding:10px;
    border-bottom:1px solid #ccc;
}

#logo{
    height:45px;
}

#search{
    width:400px;
    padding:4px;
}

#navbar{
    background:#f4f4f4;
    border-top:1px solid #ccc;
    border-bottom:1px solid #ccc;
    padding:6px;
}

#navbar a{
    text-decoration:none;
    color:#0033cc;
    margin-right:15px;
    font-weight:bold;
}

#content{
    width:960px;
    margin:auto;
    display:flex;
    margin-top:10px;
}

#main{
    width:720px;
}

#side{
    width:220px;
    margin-left:20px;
}

.box{
    border:1px solid #ccc;
    margin-bottom:15px;
}

.box-title{
    background:#e5e5e5;
    padding:8px;
    font-weight:bold;
}

#videos{
    padding:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.video{
    font-size:12px;
}

.video video{
    width:100%;
    height:100px;
    background:black;
}

.video-title{
    font-weight:bold;
    color:#0033cc;
    margin-top:3px;
}

.video-info{
    color:#666;
    font-size:11px;
}

.yellow-box{
    background:#fff8cc;
    border:1px solid #e0d68a;
    padding:10px;
}
</style>
</head>
<body>

<div id="header">

    <img src="logo.png" id="logo">

    <input type="text" id="search">

    <button>Search</button>

</div>

<div id="navbar">
    <a href="#">Home</a>
    <a href="#">Videos</a>
    <a href="#">Channels</a>
    <a href="#">Shows</a>
</div>

<div id="content">

    <div id="main">

        <div class="box">

            <div class="box-title">
                Featured Videos
            </div>

            <div id="videos">
                Carregando...
            </div>

        </div>

    </div>

    <div id="side">

        <div class="yellow-box">
            <h3>What's New</h3>

            Bem-vindo ao Veemo!<br><br>

            Compartilhe seus vídeos.
        </div>

    </div>

</div>

<script>

fetch("videos.json")
.then(r => r.json())
.then(lista => {

    let html = "";

    lista.forEach(video => {

        html += `
        <div class="video">

            <video controls>
                <source src="${video.video}" type="video/mp4">
            </video>

            <div class="video-title">
                ${video.titulo}
            </div>

            <div class="video-info">
                ${video.canal}
            </div>

            <div style="color:red">
                ★★★★★
            </div>

        </div>
        `;

    });

    document.getElementById("videos").innerHTML = html;

});

</script>

</body>
</html>
