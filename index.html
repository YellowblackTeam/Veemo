<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veemo</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

header{
    background:white;
    border-bottom:1px solid #ccc;
    padding:10px;
}

.topbar{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    height:50px;
}

.search{
    flex:1;
    display:flex;
}

.search input{
    flex:1;
    padding:8px;
}

.search button{
    padding:8px 15px;
}

nav{
    margin-top:10px;
}

nav a{
    text-decoration:none;
    color:#0033cc;
    margin-right:15px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:20px;
    margin-top:20px;
}

main{
    flex:1;
}

.sidebar{
    width:250px;
}

.box{
    background:white;
    border:1px solid #ccc;
    margin-bottom:20px;
}

.box-title{
    background:#e5e5e5;
    padding:8px;
    font-weight:bold;
}

.videos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
    padding:15px;
}

.video-card{
    border:1px solid #ddd;
    background:white;
    padding:10px;
}

.video-card video{
    width:100%;
    height:150px;
    background:black;
}

.video-title{
    font-weight:bold;
    margin-top:5px;
}

.video-channel{
    color:gray;
    font-size:12px;
}

.sidebar-box{
    background:white;
    border:1px solid #ccc;
    padding:10px;
}

footer{
    margin-top:30px;
    background:white;
    border-top:1px solid #ccc;
    padding:15px;
    text-align:center;
    color:#666;
}
</style>
</head>
<body>

<header>
    <div class="topbar">

        <img src="logo.png" class="logo">

        <div class="search">
            <input id="pesquisa" placeholder="Pesquisar vídeos...">
            <button onclick="pesquisar()">Search</button>
        </div>

    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Videos</a>
        <a href="#">Channels</a>
        <a href="#">Shows</a>
    </nav>
</header>

<div class="container">

    <main>

        <div class="box">
            <div class="box-title">Featured Videos</div>

            <div class="videos" id="videos">
                Carregando...
            </div>
        </div>

    </main>

    <div class="sidebar">

        <div class="sidebar-box">
            <h3>What's New</h3>

            <p>Bem-vindo ao Veemo!</p>

            <p>Compartilhe seus vídeos favoritos.</p>
        </div>

    </div>

</div>

<footer>
    © 2026 Veemo
</footer>

<script>

let todosVideos = [];

fetch("videos.json")
.then(r => r.json())
.then(videos => {

    todosVideos = videos;
    renderizar(videos);

});

function renderizar(videos){

    const container = document.getElementById("videos");

    container.innerHTML = "";

    videos.forEach(video => {

        container.innerHTML += `
        <div class="video-card">

            <video controls preload="metadata">
                <source src="${video.video}" type="video/mp4">
            </video>

            <div class="video-title">
                ${video.titulo}
            </div>

            <div class="video-channel">
                ${video.canal}
            </div>

        </div>
        `;
    });

}

function pesquisar(){

    const texto =
    document.getElementById("pesquisa")
    .value
    .toLowerCase();

    const resultado = todosVideos.filter(v =>
        v.titulo.toLowerCase().includes(texto) ||
        v.canal.toLowerCase().includes(texto)
    );

    renderizar(resultado);

}

</script>

</body>
</html>
